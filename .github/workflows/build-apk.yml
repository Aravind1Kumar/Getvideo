name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Distribution
        working-directory: ./frontend
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p frontend/android/app/src/main/assets/public
          cp -r frontend/dist/* frontend/android/app/src/main/assets/public/

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APK
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p output_apk
          find frontend/android/app/build/outputs/apk -name "*.apk" -exec cp {} output_apk/AK-Downloader-PandaCompress.apk \;
          echo "Generated APK files:"
          ls -lh output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AK-Downloader-PandaCompress-APK
          path: output_apk/AK-Downloader-PandaCompress.apk
          retention-days: 14
