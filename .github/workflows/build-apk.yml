name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Distribution
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: ./frontend
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle Wrapper Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Inspect Gradle Dependencies
        working-directory: ./frontend/android
        run: |
          echo "=== GRADLE RUNTIME DEPENDENCIES ==="
          ./gradlew app:dependencies --configuration releaseRuntimeClasspath

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from ANDROID_KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > frontend/android/app/release.keystore
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not found; generating dedicated release keystore for CI..."
            keytool -genkeypair -v \
              -keystore frontend/android/app/release.keystore \
              -alias "${KEY_ALIAS_SECRET:-akdownloader}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${KEYSTORE_PASS:-AravindKumarApp2026}" \
              -keypass "${KEY_PASS_SECRET:-AravindKumarApp2026}" \
              -dname "CN=Aravind Kumar, OU=Mobile, O=AK Apps, L=Hyderabad, ST=Telangana, C=IN"
          fi
          test -f frontend/android/app/release.keystore

      - name: Build Android Release APK with Gradle
        working-directory: ./frontend/android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Signature with apksigner
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          APK_PATH="frontend/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH" || (echo "ERROR: Release APK not found at $APK_PATH" && exit 1)
          echo "Using apksigner: $APKSIGNER"
          $APKSIGNER verify --verbose --print-certs "$APK_PATH"

      - name: Inspect Merged Manifest and Package Info
        run: |
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -n 1)
          APK_PATH="frontend/android/app/build/outputs/apk/release/app-release.apk"
          echo "=== AAPT DUMP BADGING ==="
          $AAPT dump badging "$APK_PATH"
          echo "=== AAPT DUMP PERMISSIONS ==="
          $AAPT dump permissions "$APK_PATH"
          echo "=== MERGED MANIFEST XML ==="
          cat frontend/android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml || cat frontend/android/app/build/intermediates/merged_manifests/release/AndroidManifest.xml || true

      - name: Generate Security Report and Prepare Distribution
        run: |
          mkdir -p output_apk
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          APK_SRC="frontend/android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="output_apk/AK-Downloader-release.apk"
          cp "$APK_SRC" "$APK_DEST"
          
          APK_SHA256=$(sha256sum "$APK_DEST" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$APK_DEST")
          CERT_SHA256=$($APKSIGNER verify --print-certs "$APK_DEST" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print $NF}')
          
          echo "Generating SECURITY_REPORT.md..."
          {
            echo "# APK Security and Audit Report"
            echo ""
            echo "- **Application ID / Package Name:** com.aravind.getvideo"
            echo "- **App Version:** 1.0 (versionCode 1)"
            echo "- **Target SDK:** 36 (minSdk: 24, compileSdk: 36)"
            echo "- **APK Filename:** AK-Downloader-release.apk"
            echo "- **APK File Size:** ${APK_SIZE} bytes ($(( APK_SIZE / 1024 )) KB)"
            echo "- **APK SHA-256:** \`${APK_SHA256}\`"
            echo "- **Signing Certificate SHA-256:** \`${CERT_SHA256}\`"
            echo "- **Signing Scheme:** v1, v2, v3 (verified with apksigner)"
            echo "- **Declared Permissions:** android.permission.INTERNET"
            echo "- **Native Libraries (.so):** None (Pure web/Capacitor WebView runtime)"
            echo "- **Local Download/Compression Tool Execution:** None (FastAPI remote backend)"
            echo "- **Exact Build Command:** \`./gradlew assembleRelease --stacktrace\`"
          } > output_apk/SECURITY_REPORT.md

          cat output_apk/SECURITY_REPORT.md
          sha256sum "$APK_DEST" > output_apk/sha256sum.txt

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AK-Downloader-PandaCompress-release
          path: |
            output_apk/AK-Downloader-release.apk
            output_apk/SECURITY_REPORT.md
            output_apk/sha256sum.txt
          if-no-files-found: error
          retention-days: 14
