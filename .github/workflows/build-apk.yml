name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Distribution
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: ./frontend
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle Wrapper Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build Android APK with Gradle
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and Copy APK
        run: |
          mkdir -p output_apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk output_apk/AK-Downloader-PandaCompress.apk
          test -f output_apk/AK-Downloader-PandaCompress.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AK-Downloader-PandaCompress-APK
          path: output_apk/AK-Downloader-PandaCompress.apk
          if-no-files-found: error
          retention-days: 14
